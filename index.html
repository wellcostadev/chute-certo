<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpite Certo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <main>
        <div id="container">
            <h1>Palpite Certo</h1>
            <p id="intro">
                Como está a sua sorte hoje? <br>
                Acerte o número secreto entre 1 e 100 <br>
                Boa sorte!
            </p>
            <p id="tentativas">Você tem 10 tentativas</p>
            
            <form>
                <div id="resposta"></div>
                <input type="text" name="chute" id="chute" placeholder="Digite o seu palpite">
                <button type="button" id="botao" onclick="chutar()">Entregar</button>
                <p id="dicas"></p>
            </form>
            
        </div>
    </main>
</body>
</html>
